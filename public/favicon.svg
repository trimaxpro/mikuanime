<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2bf7dd" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2bf7dd" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="miku-cyan" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6cd9e0" />
      <stop offset="50%" stop-color="#2bf7dd" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkle-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2bf7dd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners and themed neon border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Stylized Anime 'M' (MikuAnime) with Twin-Wing / Cyber Crest Geometry -->
  <g filter="url(#glow)">
    <!-- Left wing / stroke -->
    <path
      d="M16 48V20L25 35L32 44L24 48H16Z"
      fill="url(#miku-cyan)"
      opacity="0.9"
    />
    <!-- Right wing / stroke -->
    <path
      d="M48 48V20L39 35L32 44L40 48H48Z"
      fill="url(#miku-cyan)"
      opacity="0.9"
    />
    <!-- Center sharp chevron / crest apex -->
    <path
      d="M32 17L38 31L32 39L26 31L32 17Z"
      fill="#ffffff"
    />
  </g>

  <!-- Cybernetic Cyan Neon Accent Star / Dot -->
  <circle cx="50" cy="14" r="3.5" fill="url(#sparkle-glow)" filter="url(#glow)" />
  <circle cx="50" cy="14" r="1.5" fill="#ffffff" />
</svg>
